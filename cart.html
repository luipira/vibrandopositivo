<body>

    <div class="carrito">
        <h1>Carrito de Compras</h1>
        <div id="cart-items"></div>
        <h3>Total: $<span id="total-price">0</span></h3>

        <!-- Formulario para seleccionar el tipo de servicio -->
        <form id="orderForm">
            <label for="serviceType">¿Cómo quieres recibir tu pedido?</label>
            <select id="serviceType" name="serviceType" required>
		<option value="takeAway">Retiro por Santa Fe</option>
                <option value="delivery">Envio por Correo Argentino </option>
                
            </select>

            <button type="submit" class="btn btn-primary" style="background-color: black ; color: #fff; border: none; padding: 10px 20px; border-radius: 5px;">Finalizar Compra</button>
        </form>

        <a href="index.html" class="btn btn-secondary">Volver a la tienda</a>
    </div>

    <script>
        document.getElementById('serviceType').addEventListener('change', function () {
            const deliveryDetails = document.getElementById('deliveryDetails');
            const tableNumber = document.getElementById('tableNumber');

            if (this.value === 'delivery') {
                deliveryDetails.style.display = 'block';
                tableNumber.style.display = 'none';
            } else if (this.value === 'dineIn') {
                deliveryDetails.style.display = 'none';
                tableNumber.style.display = 'block';
            } else {
                deliveryDetails.style.display = 'none';
                tableNumber.style.display = 'none';
            }
        });

        document.getElementById('orderForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Evita el envío del formulario

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalPrice = 0;
            let cartMessage = 'Hola Oma Resto Bar, este es mi pedido:\n';
            let serviceType = document.getElementById('serviceType').value;
            let address = serviceType === 'delivery' ? document.getElementById('address').value : '';
            let table = serviceType === 'dineIn' ? document.getElementById('table').value : '';

            cart.forEach(item => {
                cartMessage += `${item.quantity} - ${item.name},\n`;
                totalPrice += item.price * item.quantity;
            });

            cartMessage += `El total es: $${totalPrice.toFixed(2)}\n`;
            if (serviceType === 'delivery') {
                cartMessage += `Dirección de entrega: ${address}`;
            } else if (serviceType === 'dineIn') {
                cartMessage += `Número de mesa: ${table}`;
            } else {
                cartMessage += `Tipo de servicio: Comida para llevar`;
            }

            let encodedMessage = encodeURIComponent(cartMessage);
            let phoneNumber = "3498402212"; // Reemplaza con tu número de WhatsApp sin signos + o espacios
            let whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            // Redirigir al usuario a WhatsApp
            window.open(whatsappUrl, '_blank');

            // Limpiar el carrito y recargar
            localStorage.removeItem('cart');
            loadCart();
        });

        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let cartItemsDiv = document.getElementById('cart-items');
            let totalPrice = 0;

            cartItemsDiv.innerHTML = '';

            cart.forEach(item => {
                let itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <span>${item.name}</span>
                    <span>$${item.price}</span>
                    <span>Qty: ${item.quantity}</span>
                    <button onclick="removeFromCart('${item.name}')">Eliminar</button>
                `;
                cartItemsDiv.appendChild(itemDiv);
                totalPrice += item.price * item.quantity;
            });

            document.getElementById('total-price').textContent = totalPrice.toFixed(2);
        }

        function removeFromCart(name) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => item.name !== name);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        // Cargar el carrito al inicio
        window.onload = loadCart;
    </script>

    <footer>
    <div class="divh5">
        <h5> Vibrando Positivo | ~ No dejes que nadie apague tu MAGIA ~   </h5>
      </div>
  </footer>
</body>
